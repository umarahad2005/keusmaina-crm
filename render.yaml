# Render Blueprint — declares the backend service so its settings live in the
# repo instead of only in the dashboard.
#
# NOTE: this file only drives services created via Render → New → Blueprint.
# A service created manually keeps using its dashboard settings and ignores
# this file, so if you already made one by hand, change it there to match.
#
# The frontend is NOT here — it deploys to Vercel from client/ (see DEPLOY.md).

services:
  - type: web
    name: keusmania-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    # Returns 503 while MongoDB is unreachable, so a deploy that can't reach
    # Atlas fails loudly here instead of at the first login attempt.
    healthCheckPath: /api/health
    envVars:
      # sync: false = Render prompts for the value and never stores it in git.
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_FOLDER
        value: keusmania
